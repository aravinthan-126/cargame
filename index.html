<!DOCTYPE html>
<html>
<head>
<title>Car Racing</title>
<style>
*{box-sizing:border-box}
body{
margin:0;height:100vh;display:grid;place-items:center;
background:#222;font-family:Arial
}
#game{
width:350px;height:600px;background:#555;
overflow:hidden;position:relative;border:4px solid white
}
#score{
position:absolute;color:white;font-size:22px;z-index:5;
padding:10px
}
#msg{
position:absolute;inset:0;display:grid;place-items:center;
color:white;font-size:28px;text-align:center;
background:#0008;z-index:10
}
.line{
position:absolute;width:8px;height:80px;
background:white;left:171px
}
.car,.enemy{
position:absolute;width:45px;height:80px;
border-radius:12px
}
.car{
background:linear-gradient(red,#700);
box-shadow:0 0 15px red
}
.car:before,.enemy:before{
content:"";position:absolute;
width:25px;height:25px;left:10px;top:10px;
background:#111;border-radius:6px;
box-shadow:0 35px #111
}
.enemy{
background:linear-gradient(yellow,#f60)
}
</style>
</head>

<body>

<div id="game">
<div id="score">Score:0</div>
<div id="msg">Press Enter</div>
</div>

<script>

let g=game,car,en=[],score=0,x=150,y=500,run=0;
let key={};

onkeydown=e=>{
key[e.key]=1;
if(e.key=="Enter"&&!run)start();
}
onkeyup=e=>key[e.key]=0;

function hit(a,b){
let A=a.getBoundingClientRect(),B=b.getBoundingClientRect();
return !(A.right<B.left||A.left>B.right||
A.bottom<B.top||A.top>B.bottom);
}

function start(){
g.innerHTML='<div id="score">Score:0</div>';
score=0;run=1;

for(let i=0;i<8;i++){
let l=document.createElement("i");
l.className="line";
l.style.top=i*90+"px";
g.append(l);
}

car=document.createElement("div");
car.className="car";
g.append(car);

en=[];
for(let i=0;i<3;i++){
let e=document.createElement("div");
e.className="enemy";
e.y=-i*200;
e.style.left=Math.random()*300+"px";
g.append(e);
en.push(e);
}

loop();
}

function loop(){

if(!run)return;

document.querySelectorAll(".line").forEach(l=>{
l.style.top=(l.offsetTop+6)%700+"px";
});

if(key.ArrowLeft)x-=6;
if(key.ArrowRight)x+=6;

x=Math.max(0,Math.min(305,x));

car.style.left=x+"px";
car.style.top=y+"px";

en.forEach(e=>{
e.y+=7;

if(e.y>600){
e.y=-100;
e.style.left=Math.random()*300+"px";
}

e.style.top=e.y+"px";

if(hit(car,e)){
run=0;
msg.style.display="grid";
msg.innerHTML="💥 Game Over<br>Score:"+score+"<br><br>Enter";
}
});

score++;
document.querySelector("#score").innerHTML="Score:"+score;

requestAnimationFrame(loop);
}

</script>

</body>
</html>
